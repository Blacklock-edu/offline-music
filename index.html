<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Music">
<meta name="theme-color" content="#0b1020">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Offline Music</title>
<style>
  :root { --bg:#0b1020; --fg:#e8ecf5; --mute:#8a93a8; --acc:#3b82f6; --card:#151b2e; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px -apple-system,system-ui,sans-serif;
         padding:env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 16px); }
  h1 { font-size:20px; margin:16px 0 8px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  button, label.btn { background:var(--card); color:var(--fg); border:1px solid #2a3350; border-radius:10px;
         padding:10px 14px; font:inherit; cursor:pointer; }
  button.primary, label.btn { background:var(--acc); border-color:var(--acc); }
  input[type=file] { display:none; }
  #status, #storage { color:var(--mute); font-size:13px; margin:6px 0; }
  #now { background:var(--card); border-radius:12px; padding:12px; margin:12px 0; }
  #now .title { font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #now .time { color:var(--mute); font-size:13px; }
  #seek { width:100%; margin:8px 0; }
  ol { list-style:none; padding:0; margin:0; }
  li { padding:10px 4px; border-bottom:1px solid #1c2340; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  li.cur { color:var(--acc); font-weight:600; }
  details { margin-top:16px; }
  #log { font:11px ui-monospace,monospace; color:var(--mute); white-space:pre-wrap; max-height:40vh; overflow:auto; }
</style>
</head>
<body>
  <h1>Offline Music <small style="color:var(--mute);font-weight:400">spike</small></h1>
  <div class="row">
    <label class="btn">Import files<input id="file" type="file" multiple accept="audio/*,.mp3,.m4a,.aac,.flac,.wav,.alac"></label>
    <button id="clear">Delete all</button>
  </div>
  <div id="status"></div>
  <div id="storage"></div>

  <div id="now">
    <div class="title" id="title">Nothing playing</div>
    <input id="seek" type="range" min="0" max="0" step="0.1" value="0">
    <div class="row" style="justify-content:space-between">
      <span class="time" id="time">0:00 / 0:00</span>
      <div class="row">
        <button id="prev">⏮</button>
        <button id="toggle" class="primary">▶</button>
        <button id="next">⏭</button>
      </div>
    </div>
  </div>

  <ol id="list"></ol>

  <details>
    <summary>Debug log</summary>
    <div class="row" style="margin:8px 0"><button id="clearlog">Clear log</button></div>
    <div id="log"></div>
  </details>

  <audio id="audio" preload="auto"></audio>
  <script src="app.js"></script>
</body>
</html>
