<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Music">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png?v=2">
<title>Offline Music</title>
<style>
  @font-face { font-family:'JBM'; src:url(fonts/jbm-400.woff2) format('woff2'); font-weight:400; font-display:swap; }
  @font-face { font-family:'JBM'; src:url(fonts/jbm-700.woff2) format('woff2'); font-weight:700; font-display:swap; }

  /* vantablack palette */
  :root {
    --bg:#000; --bg-dark:#090909; --bg-light:#1a1a1a;
    --fg:#fff; --fg-light:#ececec; --fg-dark:#505050;
    --accent:#8d8d8d; --muted:#7a7a7a; --line:#3a3a3a; --brown:#5c5c5c;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { background:var(--bg); color:var(--fg-light); }
  body { margin:0; font:13px/1.45 'JBM', ui-monospace, Menlo, monospace;
         padding:calc(env(safe-area-inset-top) + 10px) 10px calc(env(safe-area-inset-bottom) + 44px);
         -webkit-user-select:none; user-select:none; }

  /* btop-style box: title sits in the top border */
  .box { position:relative; border:1px solid var(--line); border-radius:4px; padding:14px 10px 10px; margin:0 0 14px; }
  .box > .t { position:absolute; top:-0.75em; left:8px; background:var(--bg); padding:0 4px; color:var(--fg); }
  .box > .t sup { color:var(--muted); font-size:9px; margin-right:1px; }
  .box > .r { position:absolute; top:-0.75em; right:8px; background:var(--bg); padding:0 4px; color:var(--muted); }

  .btn { background:none; border:0; color:var(--fg-light); font:inherit; padding:6px 2px; cursor:pointer; }
  .btn::before { content:'['; color:var(--muted); margin-right:4px; }
  .btn::after  { content:']'; color:var(--muted); margin-left:4px; }
  .btn:active { color:var(--bg); background:var(--fg); }
  .btn.big { font-size:15px; font-weight:700; color:var(--fg); }
  .btn .ic { width:14px; height:14px; fill:currentColor; vertical-align:-2px; display:inline-block; }
  .btn.big .ic { width:18px; height:18px; vertical-align:-3px; }
  input[type=file] { display:none; }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }

  /* now playing */
  .np { display:grid; grid-template-columns:72px 1fr; gap:12px; align-items:center; }
  .art { width:72px; height:72px; border:1px solid var(--line); display:grid; place-items:center;
         color:var(--fg-dark); font-size:10px; overflow:hidden;
         background:repeating-linear-gradient(45deg, var(--bg-dark) 0 4px, var(--bg) 4px 8px); }
  .art img { width:100%; height:100%; object-fit:cover; display:block; }
  .meta { min-width:0; }
  .title { color:var(--fg); font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .sub { color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .bar { position:relative; height:22px; margin:10px 0 2px; touch-action:none; }
  .bar .track { position:absolute; left:0; right:0; top:10px; height:2px; background:var(--line); }
  .bar .fill  { position:absolute; left:0; top:10px; height:2px; background:var(--fg); width:0; }
  .bar .head  { position:absolute; top:5px; width:2px; height:12px; background:var(--fg); left:0; margin-left:-1px; }
  .times { display:flex; justify-content:space-between; color:var(--muted); font-size:11px; }
  .ctl { justify-content:center; gap:22px; margin-top:6px; }

  /* library list, nvim/neo-tree feel */
  ol { list-style:none; padding:0; margin:0; }
  li { cursor:pointer; }
  li.trk { display:grid; grid-template-columns:3.2ch 1fr auto; gap:8px; padding:7px 4px 7px 10px; }
  li.grp { display:flex; align-items:center; gap:10px; padding:8px 4px; margin-top:4px; border-top:1px solid var(--bg-light); }
  li.grp:first-child { margin-top:0; border-top:0; }
  li.grp .gname { flex:1; min-width:0; color:var(--fg); font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  li.grp.here .gname::after { content:' ♪'; color:var(--muted); font-weight:400; }
  li.grp .gcnt { color:var(--fg-dark); }
  li.grp .gbtn { padding:0 2px; color:var(--muted); }
  li.grp .gbtn .ic { width:11px; height:11px; vertical-align:-1px; }
  li .n { color:var(--fg-dark); text-align:right; }
  li .nm { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  li .d { color:var(--fg-dark); }
  li.trk.cur { background:var(--bg-light); color:var(--fg); }
  li.cur .n { color:var(--fg); }
  li:active { background:var(--bg-light); }
  li.empty { display:block; color:var(--muted); padding:6px 4px; cursor:default; }

  #log { font-size:10px; color:var(--muted); white-space:pre-wrap; max-height:40vh; overflow:auto; margin-top:8px;
         -webkit-user-select:text; user-select:text; }
  details summary { color:var(--muted); cursor:pointer; list-style:none; }
  details summary::-webkit-details-marker { display:none; }

  /* lualine-style status bar */
  #status { position:fixed; left:0; right:0; bottom:0; display:flex; align-items:stretch; background:var(--bg-dark);
            border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom); font-size:11px; }
  #status > span { padding:5px 8px; white-space:nowrap; }
  #mode { background:var(--fg); color:var(--bg); font-weight:700; }
  #pos { color:var(--fg-light); }
  #msg { flex:1; color:var(--muted); overflow:hidden; text-overflow:ellipsis; }
  #store { color:var(--muted); }
</style>
</head>
<body>
  <section class="box">
    <span class="t"><sup>1</sup>now playing</span>
    <span class="r" id="count">0 tracks</span>
    <div class="np">
      <div class="art" id="art">no art</div>
      <div class="meta">
        <div class="title" id="title">nothing playing</div>
        <div class="sub" id="sub">—</div>
      </div>
    </div>
    <div class="bar" id="bar"><div class="track"></div><div class="fill" id="fill"></div><div class="head" id="head"></div></div>
    <div class="times"><span id="cur">0:00</span><span id="dur">0:00</span></div>
    <div class="row ctl">
      <button class="btn" id="prev" aria-label="Previous"><svg class="ic" viewBox="0 0 16 16"><path d="M3 2h2v12H3zM14 2v12L6 8z"/></svg></button>
      <button class="btn big" id="toggle" aria-label="Play"><svg class="ic" viewBox="0 0 16 16"><path id="toggle-path" d="M4 2l10 6-10 6z"/></svg></button>
      <button class="btn" id="next" aria-label="Next"><svg class="ic" viewBox="0 0 16 16"><path d="M11 2h2v12h-2zM2 2v12l8-6z"/></svg></button>
    </div>
  </section>

  <section class="box">
    <span class="t"><sup>2</sup>library</span>
    <span class="r">
      <label class="btn" style="padding:0">+folder<input id="folder" type="file" multiple webkitdirectory></label>
      <label class="btn" style="padding:0;margin-left:6px">+files<input id="file" type="file" multiple accept="audio/*,.mp3,.m4a,.aac,.flac,.wav,.alac,.aif,.aiff,.ogg,.opus"></label>
    </span>
    <ol id="list"></ol>
  </section>

  <section class="box">
    <span class="t"><sup>3</sup>debug</span>
    <details>
      <summary>show log ▾</summary>
      <div class="row" style="margin-top:6px"><button class="btn" id="clearlog">clear log</button><button class="btn" id="clear">delete all tracks</button></div>
      <div id="log"></div>
    </details>
  </section>

  <div id="status"><span id="mode">IDLE</span><span id="pos">0/0</span><span id="msg"></span><span id="store"></span></div>

  <audio id="audio" preload="auto"></audio>
  <script src="app.js"></script>
</body>
</html>
